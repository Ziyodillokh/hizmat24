services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hizmat24
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
      POSTGRES_DB: hizmat24
    # Faqat localhost'ga bog'lanadi — umumiy tarmoqqa ochilmaydi.
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hizmat24']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command:
      ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:?REDIS_PASSWORD kerak}']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  client-api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://hizmat24:${POSTGRES_PASSWORD}@postgres:5432/hizmat24?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET kerak}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:?OTP_HASH_SECRET kerak}
      # production'da "console" ishlatilmaydi — env orqali haqiqiy provayder beriladi
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      SMS_API_URL: ${SMS_API_URL:-}
      SMS_API_TOKEN: ${SMS_API_TOKEN:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  redis-data:
