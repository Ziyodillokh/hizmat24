name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint-and-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:cov

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  frontends:
    # Ikkala frontend ildizdagi tsconfig va eslint dan ATAYLAB chiqarilgan:
    # ularda JSX va `import.meta` bor, ildiz konfiguratsiyasi esa backend
    # uchun sozlangan va soxta xatolar berardi. Chiqarish tekshiruvni
    # OʻCHIRISH boʻlib qolmasligi uchun oʻrnini shu ish bosadi — har bir
    # ilova oʻz konfiguratsiyasi bilan alohida tekshiriladi.
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false — bitta ilova qulasa, ikkinchisining natijasi ham
      # koʻrinib tursin, aks holda tuzatish ikki aylanishga choʻzilardi.
      fail-fast: false
      matrix:
        app: [admin-web, client-app]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

  e2e:
    name: E2E (Postgres + Redis via Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:e2e

  security:
    name: Dependency, secret and image scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image for scanning
        run: docker build -t hizmat24-client-api:ci .

      - name: Image vulnerability scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: hizmat24-client-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
